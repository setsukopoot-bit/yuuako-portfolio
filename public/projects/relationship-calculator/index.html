<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="《叫啥呢关系通》微信小程序 UX/UI Design Case Study" />
    <title>叫啥呢关系通｜UX/UI Case Study</title>
    <link rel="stylesheet" href="./dist/assets/index-CKSnSPbf.css" />
    <style>
      .portfolio-return {
        position: fixed;
        top: 18px;
        right: 22px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(24, 27, 32, 0.88);
        box-shadow: 0 10px 28px rgba(16, 18, 22, 0.18);
        color: #fff;
        font: 600 12px/1 "Noto Sans SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.04em;
        text-decoration: none;
        backdrop-filter: blur(12px);
        transition: transform 200ms ease, background 200ms ease, box-shadow 200ms ease;
      }

      .portfolio-return:hover {
        transform: translateY(-2px);
        background: #e86d4a;
        box-shadow: 0 14px 30px rgba(16, 18, 22, 0.24);
      }

      .portfolio-return:focus-visible {
        outline: 2px solid #e86d4a;
        outline-offset: 3px;
      }

      @media (max-width: 640px) {
        .portfolio-return {
          top: 10px;
          right: 10px;
          min-height: 38px;
          padding: 0 13px;
          font-size: 11px;
        }
      }
    </style>
    <script>
      (() => {
        const localizeImage = (image) => {
          const source = image.getAttribute('src')
          if (source && source.startsWith('/')) image.setAttribute('src', `./public${source}`)
        }

        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (!(node instanceof Element)) continue
              if (node.matches?.('img')) localizeImage(node)
              node.querySelectorAll?.('img').forEach(localizeImage)
            }
          }
        })

        observer.observe(document.documentElement, { childList: true, subtree: true })
      })()
    </script>
  </head>
  <body>
    <a class="portfolio-return" href="/#projects" aria-label="返回作品集精选项目">← 返回作品集</a>
    <div id="root"></div>
    <noscript>请启用 JavaScript 以查看完整作品集详情页。</noscript>
    <script src="./dist/assets/index-CiALjClm.js"></script>
  </body>
</html>
